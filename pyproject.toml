[project]
name = "payfast-tickets"
version = "1.1.0"
description = "Event ticket booking API - Unit 4 DevOps project"
authors = [{ name = "Shoxjahon Tuymurodov" }]
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["B008"]          # FastAPI's Depends()/Query() in defaults is the intended pattern

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]       # assert is how pytest works

[tool.pytest.ini_options]
testpaths = ["tests"]
