events {}

http {
    # Docker's internal DNS. With "resolve" nginx keeps re-checking which app
    # containers exist, so "docker compose up --scale app=3" is picked up
    # without restarting nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    log_format main '$remote_addr - [$time_local] "$request" $status '
                    'upstream=$upstream_addr rt=$request_time';
    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    upstream app_backend {
        zone app_backend 64k;
        server app:5000 resolve;   # round-robin across every "app" replica
    }

    server {
        listen 80;

        location / {
            proxy_pass http://app_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3s;
            proxy_read_timeout    10s;
        }

        # nginx's own liveness, independent of the app
        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }
    }
}
