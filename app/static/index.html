<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PayFast Tickets</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1d2430; --muted: #667085; --line: #e4e7ec;
    --accent: #2563eb; --ok: #16a34a; --bad: #dc2626; --taken: #cbd2dc; --sel: #f59e0b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; align-items: center; gap: 16px; padding: 14px 24px; background: var(--card); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 19px; }
  header .sub { color: var(--muted); font-size: 13px; }
  .spacer { flex: 1; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 99px; background: var(--bg); font-size: 13px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); }
  main { display: grid; grid-template-columns: minmax(280px, 360px) 1fr; gap: 20px; padding: 20px 24px; max-width: 1200px; margin: 0 auto; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; margin-bottom: 20px; }
  h2 { margin: 0 0 12px; font-size: 16px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 8px 0 3px; }
  input, select { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; font: inherit; background: #fff; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  button { margin-top: 12px; padding: 8px 14px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
  button.secondary { background: var(--bg); color: var(--text); border: 1px solid var(--line); }
  button.danger { background: var(--bad); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .events { list-style: none; margin: 0; padding: 0; }
  .events li { padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; cursor: pointer; }
  .events li:hover { border-color: var(--accent); }
  .events li.active { border-color: var(--accent); background: #eff4ff; }
  .events .meta { color: var(--muted); font-size: 13px; }
  .empty { color: var(--muted); font-size: 14px; }
  .stage { text-align: center; font-size: 12px; color: var(--muted); letter-spacing: 3px; border-bottom: 3px solid var(--line); margin-bottom: 14px; padding-bottom: 4px; }
  .seatmap { overflow-x: auto; padding-bottom: 6px; }
  .seatrow { display: flex; gap: 5px; margin-bottom: 5px; align-items: center; }
  .seatrow .lbl { width: 20px; font-size: 12px; color: var(--muted); }
  .seat { width: 30px; height: 28px; border-radius: 5px 5px 3px 3px; border: 0; margin: 0; padding: 0; font-size: 11px; background: #dbeafe; color: var(--text); }
  .seat:hover:not(:disabled) { background: #bfdbfe; }
  .seat:disabled { background: var(--taken); color: #8a94a6; cursor: not-allowed; opacity: 1; }
  .seat.selected { background: var(--sel); color: #fff; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 8px; }
  .legend span::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -2px; }
  .legend .l-free::before { background: #dbeafe; } .legend .l-taken::before { background: var(--taken); } .legend .l-sel::before { background: var(--sel); }
  .ticket { border: 2px dashed var(--accent); border-radius: 10px; padding: 14px; background: #f8fbff; }
  .ticket .code { font: 600 18px ui-monospace, Menlo, monospace; letter-spacing: 1px; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 8px 0 0; font-size: 14px; }
  dt { color: var(--muted); } dd { margin: 0; }
  #toast { position: fixed; right: 20px; bottom: 20px; max-width: 380px; padding: 10px 14px; border-radius: 8px; color: #fff; background: var(--text); opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.show { opacity: 1; } #toast.err { background: var(--bad); } #toast.ok { background: var(--ok); }
  .hidden { display: none; }
  .lang button { margin: 0; padding: 3px 9px; font-size: 13px; }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 0 0 24px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<header>
  <div>
    <h1>🎫 PayFast Tickets</h1>
    <div class="sub" data-i18n="subtitle"></div>
  </div>
  <div class="spacer"></div>
  <span class="pill" title="GET /health"><span class="dot" id="healthDot"></span><span id="healthText">…</span></span>
  <span class="pill" title="Container / replica"><span data-i18n="server"></span>:&nbsp;<b id="hostText">…</b></span>
  <a class="pill" href="/docs" target="_blank" rel="noopener">Swagger /docs</a>
  <span class="lang"><button class="secondary" data-lang="uz">UZ</button> <button class="secondary" data-lang="en">EN</button></span>
</header>

<main>
  <div>
    <section>
      <h2 data-i18n="events"></h2>
      <ul class="events" id="eventList"></ul>
      <button class="secondary" id="reloadEvents" data-i18n="reload"></button>
    </section>

    <section>
      <h2 data-i18n="newEvent"></h2>
      <form id="eventForm">
        <label data-i18n="title"></label>
        <input name="title" required maxlength="200" value="Rock Night">
        <label data-i18n="venue"></label>
        <input name="venue" required maxlength="200" value="Tashkent Arena">
        <label data-i18n="startsAt"></label>
        <input name="starts_at" type="datetime-local" required>
        <div class="row">
          <div><label data-i18n="price"></label><input name="price" type="number" min="0" step="0.01" value="150000" required></div>
          <div><label data-i18n="rows"></label><input name="rows" type="number" min="1" max="26" value="5" required></div>
        </div>
        <label data-i18n="perRow"></label>
        <input name="seats_per_row" type="number" min="1" max="50" value="8" required>
        <button type="submit" data-i18n="create"></button>
      </form>
    </section>

    <section>
      <h2 data-i18n="findTicket"></h2>
      <form id="lookupForm">
        <label data-i18n="ticketCode"></label>
        <input name="code" required placeholder="…">
        <button type="submit" class="secondary" data-i18n="find"></button>
      </form>
      <div id="lookupResult"></div>
    </section>
  </div>

  <div>
    <section id="eventPanel">
      <h2 id="eventTitle" data-i18n="pickEvent"></h2>
      <div id="eventMeta" class="empty"></div>
      <div id="seatArea" class="hidden">
        <div class="stage" data-i18n="stage"></div>
        <div class="seatmap" id="seatMap"></div>
        <div class="legend"><span class="l-free" data-i18n="free"></span><span class="l-taken" data-i18n="taken"></span><span class="l-sel" data-i18n="selected"></span></div>
      </div>
    </section>

    <section id="bookPanel" class="hidden">
      <h2><span data-i18n="booking"></span> — <span id="seatLabel"></span></h2>
      <form id="bookForm">
        <div class="row">
          <div><label data-i18n="name"></label><input name="customer_name" required minlength="2" maxlength="120" value="Shoxjahon Tuymurodov"></div>
          <div><label data-i18n="email"></label><input name="customer_email" type="email" required value="student@example.com"></div>
        </div>
        <button type="submit" data-i18n="book"></button>
      </form>
    </section>

    <section id="payPanel" class="hidden">
      <h2><span data-i18n="booking"></span> #<span id="bookingId"></span></h2>
      <dl>
        <dt data-i18n="status"></dt><dd id="bookingStatus"></dd>
        <dt data-i18n="holdUntil"></dt><dd id="bookingExpires"></dd>
      </dl>
      <div class="row">
        <div>
          <label data-i18n="method"></label>
          <select id="payMethod"><option>card</option><option>payme</option><option>click</option><option>cash</option></select>
        </div>
      </div>
      <button id="payBtn" data-i18n="pay"></button>
      <button id="payAgainBtn" class="secondary hidden" data-i18n="payAgain"></button>
      <button id="cancelBtn" class="danger" data-i18n="cancel"></button>
    </section>

    <section id="ticketPanel" class="hidden">
      <h2 data-i18n="yourTicket"></h2>
      <div id="ticketBox"></div>
    </section>
  </div>
</main>

<footer>PayFast Tickets · Unit 4 DevOps · Shoxjahon Tuymurodov (23-309) · PDP University</footer>
<div id="toast"></div>

<script>
"use strict";

const T = {
  uz: {
    subtitle: "Tadbirlarga chipta bron qilish — test interfeysi",
    server: "Server", events: "Tadbirlar", reload: "Yangilash", newEvent: "Yangi tadbir",
    title: "Nomi", venue: "Joy", startsAt: "Boshlanish vaqti", price: "Narx (so'm)", rows: "Qatorlar (A–Z)",
    perRow: "Har qatordagi o'rinlar", create: "Tadbir yaratish", findTicket: "Chiptani topish",
    ticketCode: "Chipta kodi", find: "Qidirish", pickEvent: "Chapdan tadbirni tanlang",
    stage: "SAHNA", free: "Bo'sh", taken: "Band", selected: "Tanlangan", booking: "Bron",
    name: "Ism familiya", email: "Email", book: "Bron qilish", status: "Holat", holdUntil: "Ushlab turiladi",
    method: "To'lov usuli", pay: "To'lash", payAgain: "Qayta to'lash (shu kalit bilan)", cancel: "Bekor qilish",
    yourTicket: "Chipta", seat: "O'rin", amount: "To'langan", issued: "Berilgan", customer: "Xaridor",
    noEvents: "Hali tadbir yo'q. Pastdagi forma orqali yarating.", seatsFree: "bo'sh o'rin",
    ok: "ishlayapti", down: "ishlamayapti", created: "Tadbir yaratildi", booked: "O'rin bron qilindi",
    paid: "To'lov qabul qilindi, chipta berildi", cancelled: "Bron bekor qilindi",
    idem: "Xuddi shu Idempotency-Key bilan qayta so'rov: yangi to'lov yaratilmadi, o'sha chipta qaytdi",
    notFound: "Topilmadi",
    st_pending: "to'lov kutilmoqda", st_paid: "to'langan", st_cancelled: "bekor qilingan",
  },
  en: {
    subtitle: "Event ticket booking — test UI",
    server: "Server", events: "Events", reload: "Reload", newEvent: "New event",
    title: "Title", venue: "Venue", startsAt: "Starts at", price: "Price (UZS)", rows: "Rows (A–Z)",
    perRow: "Seats per row", create: "Create event", findTicket: "Find a ticket",
    ticketCode: "Ticket code", find: "Search", pickEvent: "Pick an event on the left",
    stage: "STAGE", free: "Free", taken: "Taken", selected: "Selected", booking: "Booking",
    name: "Full name", email: "Email", book: "Book seat", status: "Status", holdUntil: "Held until",
    method: "Payment method", pay: "Pay", payAgain: "Retry payment (same key)", cancel: "Cancel",
    yourTicket: "Ticket", seat: "Seat", amount: "Paid", issued: "Issued", customer: "Customer",
    noEvents: "No events yet. Create one with the form below.", seatsFree: "seats free",
    ok: "healthy", down: "down", created: "Event created", booked: "Seat booked",
    paid: "Payment accepted, ticket issued", cancelled: "Booking cancelled",
    idem: "Same Idempotency-Key retried: no new payment, the same ticket came back",
    notFound: "Not found",
    st_pending: "awaiting payment", st_paid: "paid", st_cancelled: "cancelled",
  },
};
let lang = localStorageGet("lang") || "uz";
const t = (k) => T[lang][k] ?? k;

function localStorageGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function localStorageSet(k, v) { try { localStorage.setItem(k, v); } catch { /* storage may be blocked */ } }

function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach((el) => {
    if (el.id === "eventTitle" && state.event) return;
    el.textContent = t(el.dataset.i18n);
  });
  renderEvents();
  refreshHealth();
}

const $ = (id) => document.getElementById(id);
const state = { events: [], event: null, seat: null, booking: null, payKey: null };

function toast(msg, kind = "") {
  const el = $("toast");
  el.textContent = msg;
  el.className = "show " + kind;
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => (el.className = ""), 4000);
}

// One place for every API call: JSON in, JSON out, readable error messages.
async function api(path, { method = "GET", body, headers = {} } = {}) {
  const res = await fetch(path, {
    method,
    headers: { ...(body ? { "Content-Type": "application/json" } : {}), ...headers },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    let msg = data.detail ?? res.statusText;
    if (Array.isArray(msg)) msg = msg.map((d) => `${d.loc?.slice(1).join(".")}: ${d.msg}`).join("; ");
    if (res.status === 429) msg = "429 Too Many Requests (nginx rate limit)";
    throw new Error(`${res.status} · ${msg}`);
  }
  return { status: res.status, data };
}

// The API stores UTC; SQLite returns it without an offset, so treat offset-less values as UTC.
const toDate = (s) => new Date(/[zZ]|[+-]\d\d:?\d\d$/.test(s) ? s : s + "Z");
const pad = (n) => String(n).padStart(2, "0");
const fmtDate = (s) => { const d = toDate(s); return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const statusText = (s) => t("st_" + s);
const fmtMoney = (v) => Number(v).toLocaleString("ru-RU") + " so'm";

function el(tag, props = {}, ...children) {
  const node = document.createElement(tag);
  Object.assign(node, props);
  children.forEach((c) => node.append(c));
  return node;
}

// ---------- health ----------
async function refreshHealth() {
  try {
    const { data } = await api("/health");
    $("healthDot").className = "dot ok";
    $("healthText").textContent = "API + DB " + t("ok");
    $("hostText").textContent = data.host;
  } catch (e) {
    $("healthDot").className = "dot bad";
    $("healthText").textContent = "API " + t("down");
    $("hostText").textContent = "—";
  }
}

// ---------- events ----------
async function loadEvents() {
  try {
    state.events = (await api("/events?limit=100")).data;
    renderEvents();
  } catch (e) { toast(e.message, "err"); }
}

function renderEvents() {
  const list = $("eventList");
  list.replaceChildren();
  if (!state.events.length) { list.append(el("li", { className: "empty", textContent: t("noEvents") })); return; }
  for (const ev of state.events) {
    const li = el("li", { className: state.event?.id === ev.id ? "active" : "" },
      el("div", { textContent: ev.title, style: "font-weight:600" }),
      el("div", { className: "meta", textContent: `${ev.venue} · ${fmtDate(ev.starts_at)}` }),
      el("div", { className: "meta", textContent: `${fmtMoney(ev.price)} · ${ev.available_seats}/${ev.total_seats} ${t("seatsFree")}` }));
    li.onclick = () => openEvent(ev.id);
    list.append(li);
  }
}

async function openEvent(id) {
  try {
    const [{ data: ev }, { data: seats }] = await Promise.all([api(`/events/${id}`), api(`/events/${id}/seats`)]);
    state.event = ev;
    state.seat = null;
    $("eventTitle").textContent = ev.title;
    $("eventMeta").textContent = `${ev.venue} · ${fmtDate(ev.starts_at)} · ${fmtMoney(ev.price)}`;
    renderSeats(seats);
    $("seatArea").classList.remove("hidden");
    $("bookPanel").classList.add("hidden");
    renderEvents();
  } catch (e) { toast(e.message, "err"); }
}

function renderSeats(seats) {
  const byRow = {};
  for (const s of seats) (byRow[s.row] ??= []).push(s);
  const map = $("seatMap");
  map.replaceChildren();
  for (const row of Object.keys(byRow).sort()) {
    const line = el("div", { className: "seatrow" }, el("span", { className: "lbl", textContent: row }));
    for (const s of byRow[row].sort((a, b) => a.number - b.number)) {
      const b = el("button", { className: "seat", textContent: s.number, disabled: !s.available, title: `${s.row}${s.number}` });
      b.onclick = () => selectSeat(s, b);
      line.append(b);
    }
    map.append(line);
  }
}

function selectSeat(seat, btn) {
  document.querySelectorAll(".seat.selected").forEach((x) => x.classList.remove("selected"));
  btn.classList.add("selected");
  state.seat = seat;
  $("seatLabel").textContent = `${seat.row}${seat.number}`;
  $("bookPanel").classList.remove("hidden");
}

$("eventForm").onsubmit = async (e) => {
  e.preventDefault();
  const f = new FormData(e.target);
  try {
    const { data } = await api("/events", { method: "POST", body: {
      title: f.get("title"), venue: f.get("venue"),
      starts_at: new Date(f.get("starts_at")).toISOString(),
      price: f.get("price"), rows: Number(f.get("rows")), seats_per_row: Number(f.get("seats_per_row")),
    } });
    toast(t("created"), "ok");
    await loadEvents();
    openEvent(data.id);
  } catch (err) { toast(err.message, "err"); }
};

// ---------- booking & payment ----------
$("bookForm").onsubmit = async (e) => {
  e.preventDefault();
  if (!state.seat) return;
  const f = new FormData(e.target);
  try {
    const { data } = await api("/bookings", { method: "POST", body: {
      seat_id: state.seat.id, customer_name: f.get("customer_name"), customer_email: f.get("customer_email"),
    } });
    toast(t("booked"), "ok");
    showBooking(data);
    $("bookPanel").classList.add("hidden");
    openEvent(state.event.id);
    loadEvents();
  } catch (err) { toast(err.message, "err"); }
};

function showBooking(b) {
  state.booking = b;
  state.payKey = crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2);
  $("bookingId").textContent = b.id;
  $("bookingStatus").textContent = statusText(b.status);
  $("bookingExpires").textContent = fmtDate(b.expires_at);
  const pending = b.status === "pending";
  $("payBtn").disabled = !pending;
  $("cancelBtn").disabled = !pending;
  $("payAgainBtn").classList.add("hidden");
  $("payPanel").classList.remove("hidden");
}

async function pay(isRetry) {
  try {
    const { data } = await api(`/bookings/${state.booking.id}/pay`, {
      method: "POST", body: { method: $("payMethod").value }, headers: { "Idempotency-Key": state.payKey },
    });
    toast(isRetry ? t("idem") : t("paid"), "ok");
    $("bookingStatus").textContent = statusText("paid");
    $("payBtn").disabled = true;
    $("cancelBtn").disabled = true;
    $("payAgainBtn").classList.remove("hidden");
    showTicket(data, $("ticketBox"));
    $("ticketPanel").classList.remove("hidden");
    loadEvents();
  } catch (err) { toast(err.message, "err"); }
}
$("payBtn").onclick = () => pay(false);
$("payAgainBtn").onclick = () => pay(true);

$("cancelBtn").onclick = async () => {
  try {
    const { data } = await api(`/bookings/${state.booking.id}/cancel`, { method: "POST" });
    toast(t("cancelled"), "ok");
    showBooking(data);
    openEvent(state.event.id);
    loadEvents();
  } catch (err) { toast(err.message, "err"); }
};

function showTicket(tk, box) {
  box.replaceChildren(el("div", { className: "ticket" },
    el("div", { className: "code", textContent: tk.code }),
    el("dl", {},
      el("dt", { textContent: t("title") }), el("dd", { textContent: tk.event_title }),
      el("dt", { textContent: t("seat") }), el("dd", { textContent: tk.seat }),
      el("dt", { textContent: t("customer") }), el("dd", { textContent: tk.customer_name }),
      el("dt", { textContent: t("amount") }), el("dd", { textContent: fmtMoney(tk.amount_paid) }),
      el("dt", { textContent: t("issued") }), el("dd", { textContent: fmtDate(tk.issued_at) }))));
}

$("lookupForm").onsubmit = async (e) => {
  e.preventDefault();
  const code = new FormData(e.target).get("code").trim();
  try {
    const { data } = await api(`/tickets/${encodeURIComponent(code)}`);
    showTicket(data, $("lookupResult"));
  } catch (err) {
    $("lookupResult").replaceChildren(el("p", { className: "empty", textContent: `${t("notFound")} (${err.message})` }));
  }
};

// ---------- start ----------
document.querySelectorAll("[data-lang]").forEach((b) => (b.onclick = () => { lang = b.dataset.lang; localStorageSet("lang", lang); applyLang(); }));
$("reloadEvents").onclick = loadEvents;
const tomorrow = new Date(Date.now() + 86400000);
tomorrow.setMinutes(tomorrow.getMinutes() - tomorrow.getTimezoneOffset());
document.querySelector("[name=starts_at]").value = tomorrow.toISOString().slice(0, 16);

applyLang();
loadEvents();
setInterval(refreshHealth, 5000);
</script>
</body>
</html>
