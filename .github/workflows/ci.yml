name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: payfast
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: payfast_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U payfast" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests (SQLite)
        run: pytest -q
      - name: Tests (PostgreSQL)
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://payfast:ci-only-password@localhost:5432/payfast_test
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: cp .env.example .env && docker compose config --quiet
      - name: Build image
        run: docker build -t payfast-tickets:ci .
      - name: Smoke test the full stack
        run: |
          docker compose up -d --build db api
          for i in $(seq 1 30); do
            [ "$(docker compose ps api --format '{{.Health}}')" = "healthy" ] && break
            sleep 3
          done
          docker compose exec -T api python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8000/health').read().decode())"
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Clean up
        if: always()
        run: docker compose down -v
