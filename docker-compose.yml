name: payfast

services:
  db:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]
    restart: unless-stopped

  api:
    build: .
    image: payfast-tickets:${APP_VERSION:-1.1.0}
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:?copy .env.example to .env}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}
      APP_VERSION: ${APP_VERSION:-1.1.0}
      BOOKING_HOLD_MINUTES: ${BOOKING_HOLD_MINUTES:-15}
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    networks: [frontend, backend]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy_headers.conf:/etc/nginx/proxy_headers.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks: [frontend]
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    ports:
      - "127.0.0.1:8080:8080"      # VM only: Docker-published ports bypass ufw
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [frontend]
    restart: unless-stopped

networks:
  frontend:
  backend:
    internal: true                 # the database has no route to the outside

volumes:
  pgdata:
