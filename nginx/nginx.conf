events {}

http {
    # Docker DNS; "resolve" keeps up with "docker compose up --scale api=N"
    resolver 127.0.0.11 valid=10s ipv6=off;

    log_format main '$remote_addr [$time_local] "$request" $status '
                    'upstream=$upstream_addr rt=$request_time';
    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    # basic protection against request floods on the booking endpoint
    limit_req_zone $binary_remote_addr zone=bookings:10m rate=10r/s;

    upstream api {
        zone api 64k;
        server api:8000 resolve;
    }

    server {
        listen 80;
        client_max_body_size 1m;
        server_tokens off;

        location /bookings {
            limit_req zone=bookings burst=20 nodelay;
            limit_req_status 429;
            proxy_pass http://api;
            include /etc/nginx/proxy_headers.conf;
        }

        location / {
            proxy_pass http://api;
            include /etc/nginx/proxy_headers.conf;
        }

        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }
    }
}
